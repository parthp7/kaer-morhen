# services.yaml — every tile on the dashboard (proposal 008 §5).
# `server: ciri` + `container: <name>` = status dot + stats via the socket
# proxy; names must match `docker ps` exactly. Secrets come in through
# {{HOMEPAGE_VAR_*}} from the stack .env — nothing real lives in this file.
# Group order/columns are in settings.yaml.

- Lab:
    - geralt:
        icon: proxmox.png
        href: https://geralt.kaermorhen.fyi
        description: PVE node · ciri, pihole-1, tailscale-2, kuma
        widget:
          type: proxmox
          url: https://{{HOMEPAGE_VAR_LAN_PREFIX}}.21:8006
          username: homepage@pve!dashboard
          password: "{{HOMEPAGE_VAR_PVE_TOKEN}}"
          node: geralt
    - yennefer:
        icon: proxmox.png
        href: https://yennefer.kaermorhen.fyi
        description: PVE node · pbs, pihole-2, proxy, tailscale-1, beszel, pulse
        widget:
          type: proxmox
          url: https://{{HOMEPAGE_VAR_LAN_PREFIX}}.22:8006
          username: homepage@pve!dashboard
          password: "{{HOMEPAGE_VAR_PVE_TOKEN_YENNEFER}}"
          node: yennefer
    - PBS:
        icon: proxmox.png
        href: https://pbs.kaermorhen.fyi
        description: nightly backups, LXC 200
        widget:
          type: proxmoxbackupserver
          url: https://{{HOMEPAGE_VAR_LAN_PREFIX}}.200:8007
          username: homepage@pbs!dashboard
          password: "{{HOMEPAGE_VAR_PBS_TOKEN}}"
    - Pulse:
        icon: mdi-pulse
        href: https://pulse.kaermorhen.fyi
        description: per-guest Proxmox + PBS view, LXC 205
        siteMonitor: http://{{HOMEPAGE_VAR_LAN_PREFIX}}.205:7655
    - Beszel:
        icon: beszel.png
        href: https://beszel.kaermorhen.fyi
        description: "metrics + alerts, LXC 204 (no widget — needs a superuser login)"
        siteMonitor: http://{{HOMEPAGE_VAR_LAN_PREFIX}}.204:8090
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://kuma.kaermorhen.fyi
        description: LXC 104
        widget:
          type: uptimekuma
          url: http://{{HOMEPAGE_VAR_LAN_PREFIX}}.104:3001
          slug: lab
    - Pi-hole 1:
        icon: pi-hole.png
        href: http://{{HOMEPAGE_VAR_LAN_PREFIX}}.101/admin
        description: LXC 101, primary
        widget:
          type: pihole
          version: 6
          url: http://{{HOMEPAGE_VAR_LAN_PREFIX}}.101
          key: "{{HOMEPAGE_VAR_PIHOLE_PASSWORD}}"
    - Pi-hole 2:
        icon: pi-hole.png
        href: http://{{HOMEPAGE_VAR_LAN_PREFIX}}.201/admin
        description: LXC 201, synced replica
        siteMonitor: http://{{HOMEPAGE_VAR_LAN_PREFIX}}.201/admin

- ciri:
    - Media share:
        icon: mdi-nas
        description: NFS from geralt — a host-side check, not a bind mount (§5)
        widget:
          type: customapi
          url: http://results/media-df.json
          refreshInterval: 60000
          mappings:
            - field: state
              label: state
              format: text
            - field: avail
              label: free
              format: bytes
            - field: pct
              label: used
              format: percent
    - qBit move:
        icon: qbittorrent.png
        description: move-on-completion, scratch → media share
        widget:
          type: customapi
          url: http://results/qbit-move.json
          refreshInterval: 30000
          mappings:
            - field: moving
              label: moving
              format: number
            - field: current
              label: current
              format: text
            - field: pct
              label: done
              format: percent
    - Pending updates:
        icon: mdi-package-variant
        href: https://olivetin.kaermorhen.fyi
        description: apt, all hosts + LXCs — refreshed 07:30 or on demand in OliveTin
        widget:
          type: customapi
          url: http://results/updates.json
          refreshInterval: 300000
          mappings:
            - field: pending_total
              label: packages
              format: number
            - field: updated
              label: checked
              format: relativeDate
    - OliveTin:
        icon: olivetin.png
        href: https://olivetin.kaermorhen.fyi
        description: script runner
        server: ciri
        container: olivetin

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.kaermorhen.fyi
