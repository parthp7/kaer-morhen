# Paperless-ngx — document management system (scan/OCR/tag/archive).
# Upstream example: https://github.com/paperless-ngx/paperless-ngx/blob/main/docker/compose/docker-compose.postgres.yml
# No tika/gotenberg: images/PDF ingestion only, saves ~1G RAM for future apps.
# Lab adaptations: pinned image tags, bind mounts under /data/stacks/paperless/,
# secrets required from .env (no insecure defaults), postgres 16 + redis
# 7.4-alpine for lab consistency (images already on the host), optional daily
# pg backup via `--profile backup`.

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-paperless}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  POSTGRES_DB: ${POSTGRES_DB:-paperless}

services:
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
    container_name: paperless
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
      # Pre-consume hook + its password list. Read-only: the container never
      # writes here, and the image ships no /usr/src/paperless/scripts to shadow.
      - ./scripts:/usr/src/paperless/scripts:ro
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      # v3 no longer infers the engine from PAPERLESS_DBHOST — it must be
      # explicit or paperless silently falls back to SQLite (migration-v3.md).
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: ${POSTGRES_DB:-paperless}
      PAPERLESS_DBUSER: ${POSTGRES_USER:-paperless}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:?set in .env}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set in .env}
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE:-Asia/Kolkata}
      TZ: Asia/Kolkata
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng}
      # v3 consumes duplicates by default; this preserves the v2 behaviour of
      # discarding a re-scanned file instead of creating a second document.
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: ${PAPERLESS_CONSUMER_DELETE_DUPLICATES:-true}
      # Decrypts password-protected PDFs before the parser sees them. Without
      # it, ocrmypdf raises EncryptedPdfError, the parser swallows it, and the
      # file imports as a silently empty, unsearchable document whose stored
      # original still prompts for a password. See scripts/pre-consume-decrypt.sh.
      PAPERLESS_PRE_CONSUME_SCRIPT: /usr/src/paperless/scripts/pre-consume-decrypt.sh
      # Cosmetic follow-up: strips the `__pw=` suffix the pre-consume escape
      # hatch leaves in the title, which paperless takes from the upload
      # filename and the hook above cannot rename. Never fails a consume.
      PAPERLESS_POST_CONSUME_SCRIPT: /usr/src/paperless/scripts/post-consume-strip-pw.sh
      # Set only if served behind a reverse proxy / real hostname (CSRF origin).
      PAPERLESS_URL: ${PAPERLESS_URL:-}
    networks:
      - paperless_net

  db:
    image: postgres:16
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
      TZ: Asia/Kolkata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paperless_net

  broker:
    image: redis:7.4-alpine
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paperless_net

  # Opt-in daily pg_dump: docker compose --profile backup up -d
  # NOTE: covers the DB only — originals/archive PDFs live in ./media and need
  # file-level backup too (see README).
  backup:
    profiles:
      - backup
    image: prodrigestivill/postgres-backup-local:16
    container_name: paperless-backup
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # TZ makes @daily fire at IST midnight, not UTC.
      TZ: Asia/Kolkata
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    depends_on:
      - db
    networks:
      - paperless_net

networks:
  paperless_net:
    driver: bridge
