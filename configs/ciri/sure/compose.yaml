# Sure (community fork of Maybe Finance) — personal finance app.
# Upstream example: https://github.com/we-promise/sure/blob/main/compose.example.yml
# Lab adaptations: pinned image tags, bind mounts under /data/stacks/sure/,
# secrets required from .env (no insecure defaults), optional daily pg backup
# via `--profile backup`.

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-sure_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  POSTGRES_DB: ${POSTGRES_DB:-sure_production}

x-rails-env: &rails_env
  <<: *db_env
  TZ: Asia/Kolkata
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set in .env}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "false"
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  # AI chat/rules. Points at the LOCAL Ollama (proposal 002) by default, so
  # there are no API costs; unset OPENAI_ACCESS_TOKEN in .env to disable AI.
  # Sure treats any non-blank OPENAI_URI_BASE as a "custom provider":
  # OPENAI_MODEL then becomes REQUIRED (registry.rb returns nil and logs an
  # error if it's blank), and it auto-switches off OpenAI's /v1/responses
  # endpoint — which Ollama does not implement — to /v1/chat/completions.
  # Reached by HOST IP, not container name: sure_net and ai_net are separate
  # bridges, and these containers override DNS to 8.8.8.8/1.1.1.1 (the Yahoo
  # workaround below), so kaermorhen.internal names would NOT resolve here.
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
  OPENAI_URI_BASE: ${OPENAI_URI_BASE:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  # Default is 60 s — too tight for local inference. 300 s is a backstop; the
  # real fix is a non-thinking model (see .env.example / README).
  OPENAI_REQUEST_TIMEOUT: ${OPENAI_REQUEST_TIMEOUT:-300}
  # Sure's token budgets default to 2048/512, sized for a smaller local model
  # than the AI stack runs; align them with Ollama's 8192 context.
  LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
  LLM_MAX_RESPONSE_TOKENS: ${LLM_MAX_RESPONSE_TOKENS:-}
  # Read by the mounted initializer below (upstream has no such env var).
  LLM_UNDELIVERED_RESPONSE_TIMEOUT: ${LLM_UNDELIVERED_RESPONSE_TIMEOUT:-240}

services:
  # Pinned 2026-08-23 from the floating `stable` tag (same digest, no version
  # change). NB the published tag is `0.7.2` -- there is no `v0.7.2`, even
  # though the image label reads v0.7.2.
  web:
    # ghcr publishes no version tags (only sha-<commit> + stable); stable is a
    # moving tag, so `docker compose pull` upgrades to the newest release.
    image: ghcr.io/we-promise/sure:0.7.2
    container_name: sure
    volumes:
      - ./storage:/rails/storage
      # Raises the assistant response timeout for slow local models — see the
      # file's header. The web container is the one that acts on it
      # (MessagesController#report_timeout); mounted on the worker too so both
      # load an identical Chat class.
      - ./initializers/zz_llm_response_timeout.rb:/rails/config/initializers/zz_llm_response_timeout.rb:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Upstream workaround: Yahoo Finance sync hangs when DNS returns IPv6 first.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - sure_net

  worker:
    image: ghcr.io/we-promise/sure:0.7.2
    container_name: sure-worker
    command: bundle exec sidekiq
    volumes:
      - ./storage:/rails/storage
      - ./initializers/zz_llm_response_timeout.rb:/rails/config/initializers/zz_llm_response_timeout.rb:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *rails_env
    networks:
      - sure_net

  db:
    image: postgres:16
    container_name: sure-db
    restart: unless-stopped
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
      TZ: Asia/Kolkata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

  redis:
    image: redis:7.4-alpine
    container_name: sure-redis
    restart: unless-stopped
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

  # Opt-in daily pg_dump: docker compose --profile backup up -d
  backup:
    profiles:
      - backup
    image: prodrigestivill/postgres-backup-local:16
    container_name: sure-backup
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-sure_production}
      POSTGRES_USER: ${POSTGRES_USER:-sure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # TZ makes @daily fire at IST midnight, not UTC.
      TZ: Asia/Kolkata
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    depends_on:
      - db
    networks:
      - sure_net

networks:
  sure_net:
    driver: bridge
