; Server-side requirements for Obsidian "Self-hosted LiveSync".
;
; Mirrors what the plugin's own provisioner (utils/couchdb/provision.ts) applies
; over the HTTP API — kept declarative here instead, so the config is in git and
; survives a container rebuild rather than living as runtime state.
;
; ---------------------------------------------------------------------------
; THE "00-" PREFIX IS LOAD-BEARING. DO NOT RENAME THIS FILE.
;
; CouchDB writes every runtime config change (HTTP API, Fauxton, and the
; LiveSync "Check database configuration" Fix buttons) into exactly ONE file:
; the LAST of its ini chain — `get_write_file(IniFiles) -> lists:last(...)` in
; config.erl, where directories expand via `lists:sort(wildcard("*.ini"))`,
; i.e. plain alphabetical order.
;
; Named `local.ini`, this file would sort AFTER the entrypoint's docker.ini and
; become that write target. Two consequences, the second serious:
;   1. CouchDB rewrites the file, stripping every comment here, and the repo
;      mirror silently diverges from the VM.
;   2. On first start couch_password_hasher persists the hashed admin password
;      via config:set("admins", …, Persist=true) — into the write-target file.
;      A git-tracked write target therefore ACQUIRES A CREDENTIAL, and the
;      CLAUDE.md mirror rule ("scp back after any change") would then commit it.
;
; With the `00-` prefix this file always sorts before docker.ini, which the
; entrypoint recreates on every start, so the write target is permanently
; docker.ini — untracked, VM-only, and already the file holding [admins].
; That is stock couchdb-docker behaviour.
;
; Precedence note: later files win on conflicting keys, so docker.ini and any
; runtime write override this baseline. That is intended — a UI-side fix should
; take effect immediately; reconcile it back into this file deliberately.
; docker.ini sets only [admins] and [chttpd_auth] secret, neither of which this
; file sets, so nothing here is currently shadowed.
; ---------------------------------------------------------------------------

[couchdb]
; Auto-create _users / _replicator / _global_changes at startup. CouchDB 3.x
; will NOT create its system databases on its own — it can't tell single-node
; from clustered — and LiveSync fails on first replication without them. This
; replaces the manual /_cluster_setup call the LiveSync docs use.
single_node = true
; LiveSync chunks note bodies, but a single document can still exceed the
; 8 MB default. 50 MB matches the plugin's provisioner.
max_document_size = 50000000

[chttpd]
bind_address = 0.0.0.0
port = 5984
; No anonymous access at all.
;
; Deliberately NOT using require_valid_user_except_for_up: it would let the
; Kuma monitor hit /_up without credentials, but it breaks Basic-auth login to
; the Fauxton UI (apache/couchdb#5186), and the same setting shipped a
; total auth bypass in 3.0.0 (CVE-2020-1955). Not worth it to save one
; credential on a monitor.
require_valid_user = true
enable_cors = true
; 4 GiB — matches the plugin's provisioner. Large initial vault pushes and
; big attachments both land as single requests.
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
; Makes browsers/clients present a Basic-auth challenge rather than a bare 401.
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
credentials = true
; app://obsidian.md      = Obsidian desktop (the only one needed today)
; capacitor://localhost  = Obsidian mobile
; http://localhost       = Obsidian dev/browser contexts
; Mobile origins are kept now so the TLS follow-up (reverse-proxy LXC 202)
; needs no change on this side.
origins = app://obsidian.md,capacitor://localhost,http://localhost
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
