# Jellyfin — media server, NVENC/NVDEC via the GTX 1060 passed through to ciri.
# Lab adaptations: pinned image tag, media (read-only) from the external USB
# HDD on geralt via virtiofs, config/cache on local NVMe, TZ=Asia/Kolkata,
# dedicated bridge network (not host networking — see README).
#
# GPU is wired in via CDI (`devices: nvidia.com/gpu=all`), NOT the legacy
# `deploy.resources.reservations.devices` block (migrated 2026-08-02). CDI puts
# the device nodes and driver libraries into the OCI spec *before* the container
# is created, so they are part of its persisted config rather than being poked
# in afterwards by a prestart hook. Background + the incident that prompted it:
# see README "Making GPU access survive daemon-reload".
#
# NVIDIA_DRIVER_CAPABILITIES / NVIDIA_VISIBLE_DEVICES are deliberately GONE.
# They were load-bearing under the legacy path (the toolkit default omits
# `video`, which silently disables NVENC/NVDEC), but CDI ignores them entirely —
# the generated spec at /etc/cdi/nvidia.yaml carries libnvidia-encode and
# libnvcuvid unconditionally (verified 2026-08-02). If this is ever reverted to
# the legacy block, BOTH variables must come back or hardware transcoding breaks.
#
# The spec path is NOT the shipped default: it was moved off tmpfs /var/run/cdi
# on 2026-08-04 because dockerd raced the boot-time regeneration and both GPU
# containers died with "unresolvable CDI devices". See docs/gpu-passthrough.md.

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      # DB, artwork, trickplay — small-file random I/O, keep on NVMe.
      - ./config:/config
      # Transcode scratch + image cache; regenerable.
      - ./cache:/cache
      # Media, READ-ONLY (2026-07-24): Jellyfin runs as root, so a rw bind was its
      # only root-write path onto the (shared) media disk. Subtitle writing moved
      # to Bazarr (uid 13000) in the servarr stack, so Jellyfin no longer needs to
      # write — least privilege restored (was rw 2026-07-23 → 2026-07-24; see README).
      # Turn OFF the OpenSubtitles plugin's "save alongside media" so it doesn't
      # try to write here; Bazarr is now the single subtitle writer.
      # create_host_path:false is the missing-mount guard (independent of ro):
      # if the USB disk failed to mount on geralt (nofail) or the share is empty,
      # this path does not exist and the container refuses to start — instead of
      # Jellyfin scanning an empty library and evicting every item from its DB.
      - type: bind
        source: /mnt/media/library
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Asia/Kolkata
      # JELLYFIN_PublishedServerUrl intentionally UNSET (2026-07-22): forcing a
      # hostname broke the Samsung TV's native player, which can't resolve the
      # internal DNS name. With it unset, clients stream from the address they
      # connected on — connect the TV by IP. See README troubleshooting.
    # CDI device injection — see header note.
    devices:
      - "nvidia.com/gpu=all"
    networks:
      - jellyfin_net

networks:
  jellyfin_net:
    driver: bridge
